server {
  # Unprivileged image: Nginx runs as a normal user, so it listens on 8080 inside the container.
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  # Static files only: nothing is ever posted.
  client_max_body_size 1k;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Container healthcheck.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build assets (app, CSS, solver worker with DDS) can be cached forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Hash routing (#/play/...): every page is index.html, so no SPA fallback is needed.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
