# Included in every location: an add_header inside a location drops all inherited ones.
# `vite preview` sends these same headers (vite.config.ts reads this file), so e2e checks the CSP too.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Everything comes from this origin. The solver worker is a separate file (worker-src 'self') and
# compiles DDS from WebAssembly bytes embedded in it ('wasm-unsafe-eval'). No network calls at all.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
